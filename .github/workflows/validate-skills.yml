name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill frontmatter and docs links
        run: scripts/validate-skills.sh

      - name: Check README skill index is up to date
        run: node scripts/build-readme.mjs --check
